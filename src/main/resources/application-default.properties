# Source database: server database. Use a database account with SELECT access only.
rebuild.source.datasource.jdbc-url=${REBUILD_SOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/mosip_idrepo}
rebuild.source.datasource.username=${REBUILD_SOURCE_USERNAME:postgres}
rebuild.source.datasource.password=${REBUILD_SOURCE_PASSWORD:}
rebuild.source.datasource.driver-class-name=org.postgresql.Driver

# Target database: local database. Use a database account with INSERT access only.
rebuild.target.datasource.jdbc-url=${REBUILD_TARGET_JDBC_URL:jdbc:postgresql://localhost:5432/mosip_idrepo}
rebuild.target.datasource.username=${REBUILD_TARGET_USERNAME:postgres}
rebuild.target.datasource.password=${REBUILD_TARGET_PASSWORD:}
rebuild.target.datasource.driver-class-name=org.postgresql.Driver

# Job safety
rebuild.dry-run=${REBUILD_DRY_RUN:true}
rebuild.created-by=anonymous-profile-rebuild-job

# Key Manager connection settings. The approved decrypt client will be added separately.
mosip.idrepo.app-id=ID_REPO
mosip.idrepo.crypto.refId.uin-data=identity_data
mosip.kernel.keymanager.decrypt-url=https://api-internal.dev.mosip.net/v1/keymanager/decrypt
mosip.kernel.keymanager.encrypt-url=https://api-internal.dev.mosip.net/v1/keymanager/encrypt

# Auth Manager client settings retained for deployment configuration; no application auth layer is enabled.
mosip.authmanager.client-id=mosip-regproc-client
mosip.authmanager.client-secret=${MOSIP_AUTHMANAGER_CLIENT_SECRET:}
mosip.authmanager.app-id=regproc
mosip.authmanager.token-url=https://api-internal.dev.mosip.net/v1/authmanager/authenticate/clientidsecretkey

spring.main.web-application-type=none
spring.main.banner-mode=off
logging.level.root=INFO
